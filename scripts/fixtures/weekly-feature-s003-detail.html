              <p>시군 상세 자료의 첫 문단은 지역 현안의 공식 발표 내용과 적용 대상을 설명한다. 수집기는 목록 경로와 다른 공통 상세 경로에서도 시군 코드를 유지하고 정확한 본문을 읽어야 한다.</p>
              <p>두 번째 문단은 일정과 책임 주체, 주민이 확인할 후속 절차를 구분한다. 첨부 영역의 파일명은 기사 본문에 섞이지 않으며 공식 본문만 모델 근거로 전달되어야 한다.</p>
