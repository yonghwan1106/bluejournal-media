            <div class="postBody">
              <p>첫 문단 고유 문구와 함께 공식 발표의 대상, 시점, 담당 기관을 구분해 설명한다. 이 문장은 상세 본문 최소 길이 검증을 충족하도록 실제 기사 문단과 비슷한 길이로 구성한 고정 테스트 자료다.</p>
              <p>두 번째 문단은 정책의 집행 조건과 주민 영향, 후속 확인 항목을 과장 없이 정리한다. 공식 문서에 없는 인과관계나 수치는 추가하지 않으며 독자가 원문과 대조할 수 있게 한다.</p>
